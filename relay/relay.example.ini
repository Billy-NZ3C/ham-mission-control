# Copy this file to relay.ini (same folder) and fill it in.
# relay.ini is listed in .gitignore so your QRZ key never ends up on GitHub.

[relay]
# The clock will be at http://<this computer's address>:8088/
port = 8088

[qrz]
# Optional. Your QRZ Logbook API key (QRZ.com -> My Logbook -> Settings -> API).
# Leave blank to turn QRZ off. Downloading through the API may need a QRZ subscription.
api_key =
check_every_seconds = 180

[wsjtx]
# In WSJT-X: File -> Settings -> Reporting -> UDP Server = this computer's address, port 2237
# (or 224.0.0.1 if JTAlert / GridTracker share the feed)
udp_port = 2237
multicast_group = 224.0.0.1
